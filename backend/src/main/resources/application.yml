spring:
  application:
    name: arcadia-backend

  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/${DB_NAME:arcadia}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ms: 900000
    refresh-token-ms: 604800000
  upload-dir: uploads

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
